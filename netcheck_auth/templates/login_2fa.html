{% extends "base.html" %}
{% block title %}Second factor{% endblock %}
{% block content %}
<h1>Two-factor authentication</h1>
<p>Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Code
    <input name="code" required maxlength="32" inputmode="text" autocomplete="one-time-code" autofocus>
  </label>
  <button type="submit">Verify</button>
</form>
<p class="muted"><a href="{{ url_for('auth.login') }}">Cancel</a></p>
{% endblock %}
